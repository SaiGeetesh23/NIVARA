services:

  # ── 1. PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine          
    container_name: nivara-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2005
      POSTGRES_DB: Nivara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"                  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Nivara"]
      interval: 10s                    # Check every 10 seconds
      timeout: 5s                      # Fail if no response in 5s
      retries: 5                       # Fail the healthcheck after 5 failed attempts

  # ── 2. FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./Backend              
      dockerfile: Dockerfile
    container_name: nivara-backend
    env_file:
      - ./Backend/.env                # Loads OPENAI_API_KEY, ZILLIZ creds, SECRET_KEY etc.
    environment:
      # Override DATABASE_URL to use Docker's internal hostname "postgres"
      # (not localhost - that would point to inside the container itself)
      DATABASE_URL: postgresql://postgres:2005@postgres:5432/Nivara
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy    # Only start after Postgres health check passes
    restart: unless-stopped           # Auto-restart if backend crashes

  # ── 3. Next.js Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./nivara-frontend      # Use nivara-frontend/Dockerfile
      dockerfile: Dockerfile
    container_name: nivara-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend                       # Start after backend is up
    restart: unless-stopped

# Named volume declaration
# Docker manages this volume - data survives even if containers are deleted
volumes:
  postgres_data:
